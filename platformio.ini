[env:esp32_035]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  ricmoo/QRCode@0.0.1
build_flags =
  -DUSER_SETUP_LOADED
  -DST7796_DRIVER
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DUSE_HSPI_PORT
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=27
  -DTFT_BACKLIGHT_ON=HIGH
  -DTOUCH_CS=33
  -DSPI_FREQUENCY=27000000
  -DSPI_READ_FREQUENCY=16000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DLOAD_GLCD
  -DLOAD_FONT4
